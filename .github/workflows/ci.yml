name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate content
        run: npm run validate:content

      - name: Validate Bridge config
        run: node scripts/validate-bridge-config.mjs

      - name: Build
        run: npm run build

      - name: Package web build
        run: npm run package

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: blockbreaker-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload web ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: blockbreaker-web
          path: release/blockbreaker-web.zip
          if-no-files-found: error
          retention-days: 7
