<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  #banner {
    background:
      radial-gradient(85% 180% at 71% 48%, rgba(28, 176, 186, 0.36) 0%, rgba(10, 74, 102, 0.22) 38%, transparent 70%),
      radial-gradient(70% 150% at 98% 40%, rgba(122, 76, 192, 0.30) 0%, transparent 66%),
      linear-gradient(100deg, #02060d 0%, #03111b 34%, #051c27 58%, #020a12 100%);
  }
  .scrim-left {
    background: linear-gradient(90deg, rgba(2, 6, 13, 1) 0%, rgba(2, 6, 13, 0.97) 30%, rgba(2, 6, 13, 0.72) 44%, rgba(2, 6, 13, 0) 60%);
  }
  .wall { position: absolute; left: 332px; top: -14px; width: 250px; height: 180px; transform: rotate(-6deg); transform-origin: 50% 50%; }
  .wall .brick { width: 37px; height: 37px; }
  .impact-glow {
    left: 415px; top: -50px; width: 190px; height: 190px;
    background: radial-gradient(circle, rgba(210,255,255,0.5) 0%, rgba(90,230,255,0.22) 32%, rgba(20,120,180,0.08) 55%, transparent 70%);
  }
  .rays { left: 486px; top: -28px; width: 132px; height: 132px; opacity: .42; }
  .core { left: 519px; top: 4px; width: 66px; height: 66px; opacity: .52; }
  .ring1 { left: 515px; top: 1px; width: 64px; height: 64px; opacity: .3; }
  .ring2 { left: 541px; top: 26px; width: 17px; height: 17px; opacity: .6; }
  .extra-glow-r { left: 560px; top: -20px; width: 180px; height: 130px;
    background: radial-gradient(circle, rgba(255,47,208,.12), transparent 68%); }
</style>
</head>
<body>
<div id="banner">
  <div class="layer bg"></div>
  <div class="layer grid"></div>
  <div class="layer" id="stars"></div>

  <div class="layer impact-glow"></div>

  <div class="wall" id="wall"></div>

  <div class="layer burst-rays rays"></div>
  <div class="layer burst-core core"></div>
  <div class="layer ring ring1"></div>
  <div class="layer ring ring2"></div>
  <div class="layer" id="shards"></div>

  <svg width="190" height="90" viewBox="0 0 190 90" style="position:absolute; left:360px; top:0; overflow:visible;">
    <defs>
      <linearGradient id="trailGrad" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#7ef9ff" stop-opacity="0"/>
        <stop offset=".38" stop-color="#7ef9ff" stop-opacity=".35"/>
        <stop offset="1" stop-color="#f2ffff" stop-opacity=".95"/>
      </linearGradient>
      <filter id="trailGlow" x="-40%" y="-90%" width="180%" height="280%">
        <feGaussianBlur stdDeviation="3.4"/>
      </filter>
    </defs>
    <path d="M 73 80 C 102 75, 113 49, 141 38" fill="none" stroke="#02060d" stroke-opacity=".9" stroke-width="15" stroke-linecap="round" filter="url(#trailGlow)"/>
    <path d="M 73 80 C 102 75, 113 49, 141 38" fill="none" stroke="#37d9ff" stroke-opacity=".7" stroke-width="13" stroke-linecap="round" filter="url(#trailGlow)"/>
    <path d="M 73 80 C 102 75, 113 49, 141 38" fill="none" stroke="url(#trailGrad)" stroke-width="7.5" stroke-linecap="round"/>
    <path d="M 73 80 C 102 75, 113 49, 141 38" fill="none" stroke="#ffffff" stroke-opacity=".98" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="112" cy="61" r="2.2" fill="#eaffff" opacity=".98"/>
    <circle cx="128" cy="47" r="1.5" fill="#eaffff" opacity=".85"/>
    <circle cx="95" cy="73" r="1.6" fill="#eaffff" opacity=".8"/>
  </svg>

  <div class="paddle-glow" style="left:372px; top:66px; width:138px; height:30px;"></div>
  <div class="paddle" style="left:388px; top:77px; width:94px;"><i class="p-diamond"></i></div>

  <div class="ball hero" style="left:492px; top:27px; width:27px; height:27px;"></div>
  <div class="spark4" style="left:537px; top:31px; width:16px; height:16px; opacity:.95;"></div>

  <div class="trail" style="left:381px; top:19px; width:52px; transform:rotate(24deg); opacity:.6;"></div>
  <div class="ball" style="left:369px; top:12px; width:14px; height:14px; box-shadow:0 0 5px 2px rgba(255,255,255,.9),0 0 14px 5px rgba(87,234,255,.55);"></div>

  <div class="powerup" style="left:402px; top:55px; width:25px; height:25px; transform:rotate(-8deg);">
    <div class="dia"></div>
  </div>

  <div class="layer scrim-left"></div>
  <div class="layer vignette"></div>

  <div class="wordmark" style="left:24px; top:5px; font-size:44px;">
    <span class="l l-glow">BRICKLIKE</span>
    <span class="l l-shadow">BRICKLIKE</span>
    <span class="l l-outline">BRICKLIKE</span>
    <span class="l l-fill">BRICKLIKE</span>
  </div>

  <div class="tagline" style="left:27px; top:55px;">
    <span class="dia"></span>
    <span>ROGUELITE BRICK-BREAKER</span>
    <span class="dia"></span>
  </div>

  <div class="micro" style="left:27px; top:71px; font-size:8.5px; letter-spacing:1.2px;">
    <b>FREE</b><span class="sep">/</span>NO DOWNLOAD<span class="sep">/</span>BROWSER
  </div>

  <div class="cta" style="left:596px; top:28px; width:110px;">
    <span class="play"></span>
    <span>PLAY FREE</span>
  </div>
  <div class="cta-sub" style="left:596px; top:65px; width:110px;">ONE MORE RUN AWAITS</div>

  <div class="layer scanlines"></div>
</div>

<script>
  // deterministic starfield
  let seed = 1337;
  const rnd = () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const stars = document.getElementById('stars');
  for (let i = 0; i < 62; i++) {
    const s = document.createElement('i');
    s.className = 'star';
    const size = rnd() < 0.82 ? 1 : 2;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.round(rnd() * 726) + 'px';
    s.style.top = Math.round(rnd() * 88) + 'px';
    s.style.opacity = (0.18 + rnd() * 0.7).toFixed(2);
    stars.appendChild(s);
  }

  // brick wall with a blast hole
  const wall = document.getElementById('wall');
  const layout = [
    ['gold','','cyan','violet','cyan','magenta'],
    ['cyan','violet','','cyan','','gold'],
    ['teal','cyan','magenta','','violet','cyan'],
    ['cyan','green','','gold','cyan','teal'],
  ];
  const icons = { '2-1':'diamond', '3-2':'laser', '1-3':'plus', '0-5':'ring' };
  const colors = { diamond:'#e6feff', laser:'#ffd8f5', plus:'#d8ffe7', ring:'#fff6d6' };
  layout.forEach((row, r) => {
    row.forEach((color, c) => {
      if (!color) return;
      const b = document.createElement('div');
      b.className = 'brick ' + color;
      b.style.left = (c * 40) + 'px';
      b.style.top = (r * 40) + 'px';
      b.innerHTML = '<i class="spark"></i><i class="rivets"></i>';
      const icon = icons[r + '-' + c];
      if (icon === 'diamond') {
        b.innerHTML += '<span class="icon"><svg width="17" height="17" viewBox="0 0 20 20"><path d="M10 2 18 10 10 18 2 10Z" fill="none" stroke="'+colors[icon]+'" stroke-width="2"/><path d="M10 6 14 10 10 14 6 10Z" fill="'+colors[icon]+'" opacity=".55"/></svg></span>';
      } else if (icon === 'laser') {
        b.innerHTML += '<span class="icon"><svg width="18" height="18" viewBox="0 0 20 20"><path d="M3 17 17 3" stroke="'+colors[icon]+'" stroke-width="2.4"/><path d="M3 13 7 17M13 3 17 7" stroke="'+colors[icon]+'" stroke-width="1.4" opacity=".8"/></svg></span>';
      } else if (icon === 'plus') {
        b.innerHTML += '<span class="icon"><svg width="17" height="17" viewBox="0 0 20 20"><path d="M8 2h4v6h6v4h-6v6H8v-6H2V8h6Z" fill="'+colors[icon]+'"/></svg></span>';
      } else if (icon === 'ring') {
        b.innerHTML += '<span class="icon"><svg width="17" height="17" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6" fill="none" stroke="'+colors[icon]+'" stroke-width="2"/><circle cx="10" cy="10" r="2" fill="'+colors[icon]+'"/></svg></span>';
      }
      wall.appendChild(b);
    });
  });

  // debris
  const shards = document.getElementById('shards');
  const palette = ['#e6feff','#9cf6ff','#38cfe8','#c39cff','#7a4cc0','#ffe59a','#e0a62a','#ff8fe4'];
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('i');
    p.className = 'shard';
    const w = 4 + Math.round(rnd() * 11);
    const h = 3 + Math.round(rnd() * 9);
    const angle = rnd() * Math.PI * 2;
    const dist = 26 + rnd() * 96;
    p.style.width = w + 'px';
    p.style.height = h + 'px';
    p.style.left = (500 + Math.cos(angle) * dist) + 'px';
    p.style.top = (40 + Math.sin(angle) * dist * 0.62 - 4) + 'px';
    p.style.background = palette[Math.floor(rnd() * palette.length)];
    p.style.transform = 'rotate(' + Math.round(rnd() * 180) + 'deg)';
    if (i % 3 === 0) p.style.clipPath = 'polygon(50% 0, 100% 100%, 0 100%)';
    shards.appendChild(p);
  }
</script>
</body>
</html>
